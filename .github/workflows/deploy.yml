name: Deploy theme via FTP

# Uploads the theme to the server on every push to main.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER     e.g. ftpupload.net
#   FTP_USERNAME   e.g. if0_12345678
#   FTP_PASSWORD   the FTP password
#   FTP_THEME_DIR  e.g. /htdocs/wp-content/themes/ldrc/   (must end with /)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Check secrets
        if: env.FTP_SERVER == ''
        run: echo "FTP secrets are not set yet — skipping deploy."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Upload theme
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_THEME_DIR }}
          protocol: ftp
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
